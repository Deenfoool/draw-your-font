services:
  draw-your-font:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      PORT: 8000
      HOST: 0.0.0.0
      DYFR_DATA_DIR: /data/public-fonts
      DYFR_TRUST_PROXY: ${DYFR_TRUST_PROXY:-0}
      DYFR_MAX_PUBLIC_BYTES: ${DYFR_MAX_PUBLIC_BYTES:-5368709120}
      DYFR_MAX_PUBLIC_FONTS: ${DYFR_MAX_PUBLIC_FONTS:-10000}
      DYFR_ADMIN_TOKEN: ${DYFR_ADMIN_TOKEN:-}
    volumes:
      - draw-your-font-data:/data

volumes:
  draw-your-font-data:
