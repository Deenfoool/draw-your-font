name: Test and deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deterministic-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund
      - name: Install independent validators
        run: python -m pip install --disable-pip-version-check fonttools brotli websocket-client
      - name: Build autonomous WOFF2 runtime
        run: npm run build:runtime
      - name: Run deterministic and Chromium tests
        run: npm run test:all
      - name: Verify generated runtime files
        run: test -s vendor/woff2-codec.mjs && test -s vendor/woff2.wasm

  cross-browser-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund
      - name: Build autonomous WOFF2 runtime
        run: npm run build:runtime
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Run Chromium, Firefox and WebKit full-cycle tests
        run: npm run test:cross-browser

  deploy:
    needs: [deterministic-tests, cross-browser-tests]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund
      - name: Build autonomous WOFF2 runtime
        run: npm run build:runtime
      - name: Remove development-only files
        run: rm -rf node_modules tests scripts playwright.config.mjs package-lock.json
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
